<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login — SHARMA CONTRACTORS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-main">SHARMA CONTRACTORS</div>
      <div class="admin-tag">Admin Access</div>
    </div>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="padding: 0.75rem 1rem; margin-bottom: 1.5rem; font-size: 0.85rem; text-align: center;
               {% if category == 'error' %}background:#fef2f2; color:#991b1b;{% else %}background:#eff6ff; color:#1e40af;{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('admin_login') }}" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus style="width: 100%; border: 1px solid var(--light-gray); padding: 0.75rem;">
      </div>
      <div class="form-group" style="margin-bottom: 2rem;">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required style="width: 100%; border: 1px solid var(--light-gray); padding: 0.75rem;">
      </div>
      <button type="submit" class="btn btn-gold" style="width: 100%; justify-content: center;">Log In</button>
    </form>
    
    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="{{ url_for('index') }}" style="font-size: 0.8rem; color: var(--mid-gray); text-decoration: underline;">← Back to Website</a>
    </div>
  </div>
</body>
</html>
