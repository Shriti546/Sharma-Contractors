{% extends 'admin/layout.html' %}
{% block page_title %}Change Password{% endblock %}

{% block admin_content %}
<div style="max-width: 550px; background: white; padding: 2.5rem; border-radius: 8px; border: 1px solid var(--light-gray); box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
  <p style="color: var(--mid-gray); margin-bottom: 2rem; font-size: 0.95rem;">
    Change your admin login password. Ensure you choose a strong password and remember it.
  </p>

  <form method="POST" action="{{ url_for('admin_change_password') }}">
    <div class="form-group" style="margin-bottom: 1.5rem;">
      <label for="current_password" style="display:block; font-weight:600; margin-bottom:0.5rem; font-size:0.9rem;">Current Password</label>
      <input type="password" id="current_password" name="current_password" required
             style="width:100%; padding:0.75rem 1rem; border:1px solid #d1d5db; border-radius:4px; font-size:0.95rem;">
    </div>

    <div class="form-group" style="margin-bottom: 1.5rem;">
      <label for="new_password" style="display:block; font-weight:600; margin-bottom:0.5rem; font-size:0.9rem;">New Password</label>
      <input type="password" id="new_password" name="new_password" required minlength="6"
             style="width:100%; padding:0.75rem 1rem; border:1px solid #d1d5db; border-radius:4px; font-size:0.95rem;">
    </div>

    <div class="form-group" style="margin-bottom: 2rem;">
      <label for="confirm_password" style="display:block; font-weight:600; margin-bottom:0.5rem; font-size:0.9rem;">Confirm New Password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
             style="width:100%; padding:0.75rem 1rem; border:1px solid #d1d5db; border-radius:4px; font-size:0.95rem;">
    </div>

    <button type="submit" class="btn btn-gold" style="padding: 0.85rem 2.5rem; font-size: 0.95rem; font-weight:600;">
      Update Password
    </button>
  </form>
</div>
{% endblock %}
